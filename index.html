<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    `flutter build web --base-href` replaces this placeholder; keep it in
    case the app is ever served from a sub-path.
  -->
  <base href="/nclex-prep-preview/">

  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <!-- No viewport tag: Flutter Web installs its own and replaces any it finds. -->
  <meta name="description" content="NCLEX-RN practice: adaptive exams, unfolding case studies, drug cards and clinical simulations, with spoken explanations.">
  <meta name="theme-color" content="#00696D">

  <!-- iOS home-screen install -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NCLEX Prep">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NCLEX Prep</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Matches the native splash: the brand tile centred on the app
       background, so the page dissolves into the first Flutter frame
       instead of showing a blank screen while the engine loads. */
    html, body { height: 100%; margin: 0; background: #F4F8F8; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #F4F8F8; color: #1C2B2D;
      font: 500 17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 250ms ease-out;
    }
    #splash img { width: 96px; height: 96px; }
    #splash.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <div>NCLEX Prep</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
